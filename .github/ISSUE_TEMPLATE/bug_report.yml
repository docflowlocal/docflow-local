name: Bug report
description: Report a reproducible DocFlow Local defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Do not attach confidential customer files. Use synthetic examples only."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.3.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: ["macOS Apple Silicon", "macOS Intel", "Windows 11", "Windows 10", "Linux / source build", "Other"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic data and list the smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed customer, personal, and confidential data from this report.
          required: true
