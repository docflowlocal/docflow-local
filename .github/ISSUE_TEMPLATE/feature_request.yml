name: Feature request
description: Propose a focused workflow improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Current workflow
      description: Describe the document task, frequency, and current manual steps.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: dropdown
    id: industry
    attributes:
      label: Primary use case
      options: ["Trade quotation", "Engineering delivery", "HR onboarding", "Compliance", "Education", "Real estate", "General", "Other"]
