name: Windows Self-Signed Preview

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed preview version tag to package
        required: true
        default: v0.6.1-preview.1
        type: string

permissions:
  contents: read

concurrency:
  group: windows-self-signed-preview-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  package-windows-self-signed-preview:
    runs-on: windows-latest
    timeout-minutes: 50
    environment: windows-self-signed-preview
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DOCFLOW_SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Check out reviewed preview tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Validate immutable preview source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Version = (& node -p "require('./package.json').version").Trim()
          if ($env:DOCFLOW_SOURCE_REF -ne "v$Version" -or $env:DOCFLOW_SOURCE_REF -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$') {
            throw "source_ref must exactly match the package preview version tag"
          }
          $TagCommit = (git rev-parse --verify "refs/tags/$env:DOCFLOW_SOURCE_REF`^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $TagCommit -ne (git rev-parse HEAD).Trim()) {
            throw "source_ref must be an annotated or lightweight tag resolving to HEAD"
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Preview source must be reachable from origin/main" }

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production and build dependencies
        run: npm audit --audit-level=high

      - name: Validate pinned public preview certificate
        run: node desktop/windows-preview-certificate.js

      - name: Test reviewed source before key access
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { throw "Desktop tests failed" }
          npm run test:release
          if ($LASTEXITCODE -ne 0) { throw "Release tests failed" }
          if ((git status --porcelain).Length -gt 0) { throw "Tests changed tracked source files" }

      - name: Import protected preview signing key
        shell: powershell
        env:
          DOCFLOW_WIN_PREVIEW_PFX_BASE64: ${{ secrets.DOCFLOW_WIN_PREVIEW_PFX_BASE64 }}
          DOCFLOW_WIN_PREVIEW_PFX_PASSWORD: ${{ secrets.DOCFLOW_WIN_PREVIEW_PFX_PASSWORD }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop/prepare-windows-preview-signing.ps1

      - name: Build, smoke test, and verify Windows Preview
        shell: powershell
        run: npm run build:win:self-signed-preview -- -SkipTests

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop/cleanup-windows-preview-signing.ps1

      - name: Upload verified Windows Preview bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docflow-local-windows-x64-self-signed-preview
          path: dist/windows-community-*-x64-self-signed-preview/*
          if-no-files-found: error
          retention-days: 30
